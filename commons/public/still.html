<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg">
<style>:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}*{box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>The Unnamed Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: a full-bleed night-canvas; names ring a central light; touch each to let it fall. */
  :root{
    --void:#05070e;        /* the ground — deep, not pure black */
    --void-2:#0a0f1c;      /* a second night, for the radial floor */
    --glow:#f4e8c8;        /* the center light — warm, uncolorable */
    --glow-soft:#e9d8a6;
    --name:#b9c2d8;        /* the names, cool starlight */
    --name-dim:#5d6782;    /* a fallen or distant name */
    --thread:#2a3350;      /* hairlines, the faint weave */
    color-scheme: dark;
  }
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(130% 100% at 50% 62%, var(--void-2) 0%, var(--void) 72%);
    color:var(--name);
    font-family:"Cormorant Garamond", Georgia, "Times New Roman", serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #sky{position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0}

  #stage{
    position:fixed; inset:0; z-index:1;
    display:grid; place-items:center;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
  }
  #field{
    position:relative;
    width:min(92vmin, 680px);
    aspect-ratio:1/1;
    max-width:100%;
  }

  /* the center */
  #heart{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:34%; aspect-ratio:1/1;
    border-radius:50%;
    pointer-events:none;
    background:
      radial-gradient(circle at 50% 50%,
        rgba(255,251,240,.95) 0%,
        var(--glow) 16%,
        rgba(233,216,166,.42) 38%,
        rgba(233,216,166,.12) 60%,
        transparent 74%);
    filter:blur(.4px);
    animation:breathe 7.5s ease-in-out infinite;
  }
  #heart::after{
    content:""; position:absolute; inset:-40%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(244,232,200,.14) 0%, transparent 62%);
  }
  @keyframes breathe{
    0%,100%{opacity:.82; transform:translate(-50%,-50%) scale(.97)}
    50%    {opacity:1;   transform:translate(-50%,-50%) scale(1.04)}
  }

  /* the names */
  .name{
    position:absolute;
    transform:translate(-50%,-50%);
    appearance:none; -webkit-appearance:none;
    background:transparent; border:0; margin:0; padding:.15em .35em;
    color:var(--name);
    font-family:inherit;
    font-size:clamp(1.15rem, 4.4vmin, 2.1rem);
    font-weight:500;
    font-style:italic;
    letter-spacing:.01em;
    line-height:1;
    cursor:pointer;
    white-space:nowrap;
    text-shadow:0 0 18px rgba(120,140,190,.35);
    transition:opacity 1.15s ease, filter 1.15s ease, transform 1.15s ease, color .6s ease;
    will-change:opacity, transform;
  }
  .name:hover,.name:focus-visible{ color:#e6ecf8; outline:none }
  .name:focus-visible{ text-decoration:underline dotted; text-underline-offset:.3em }
  .name.falling{
    opacity:0;
    filter:blur(3px);
    pointer-events:none;
  }

  /* the instruction */
  #whisper{
    position:fixed; z-index:2;
    left:0; right:0;
    bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    text-align:center;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
    font-family:"Jost", system-ui, sans-serif;
    text-transform:uppercase;
    letter-spacing:.42em;
    font-size:.64rem;
    font-weight:400;
    color:var(--name-dim);
    transition:opacity 1s ease;
  }
  #whisper .count{ font-variant-numeric:tabular-nums; color:var(--name) }

  /* the stillness, revealed when the last name falls */
  #stillness{
    position:fixed; z-index:3; inset:0;
    display:grid; place-items:center;
    padding-left:max(24px, env(safe-area-inset-left,0px));
    padding-right:max(24px, env(safe-area-inset-right,0px));
    text-align:center;
    opacity:0; pointer-events:none;
    transition:opacity 2.4s ease;
  }
  #stillness.shown{ opacity:1; pointer-events:auto }
  #stillness .inner{
    position:relative;
    max-width:34ch; display:flex; flex-direction:column; gap:1.4rem; align-items:center;
  }
  #stillness .inner::before{
    content:""; position:absolute; z-index:-1;
    inset:-14% -10%;
    border-radius:50%;
    background:radial-gradient(60% 55% at 50% 50%, rgba(5,7,14,.82) 0%, rgba(5,7,14,.5) 55%, transparent 80%);
    filter:blur(6px);
  }
  #stillness p{
    margin:0;
    font-size:clamp(1.35rem, 5vmin, 2.1rem);
    font-style:italic;
    line-height:1.4;
    color:var(--glow-soft);
    text-wrap:balance;
    text-shadow:0 0 26px rgba(233,216,166,.22);
  }
  #stillness .line2{ color:var(--name); font-style:normal; font-size:clamp(1rem,3.6vmin,1.3rem) }
  #again{
    margin-top:.6rem;
    appearance:none; -webkit-appearance:none;
    background:transparent;
    border:1px solid var(--thread);
    color:var(--name-dim);
    font-family:"Jost", system-ui, sans-serif;
    text-transform:uppercase; letter-spacing:.34em; font-size:.6rem;
    padding:.85em 1.6em; border-radius:999px;
    cursor:pointer;
    transition:color .5s ease, border-color .5s ease;
  }
  #again:hover,#again:focus-visible{ color:var(--name); border-color:var(--name-dim); outline:none }

  @media (prefers-reduced-motion: reduce){
    #heart{ animation:none }
    .name{ transition:opacity .4s ease, filter .4s ease }
    #stillness{ transition:opacity .9s ease }
  }
</style>

<canvas id="sky" aria-hidden="true"></canvas>

<main id="stage">
  <div id="field" role="group" aria-label="Names of the nameless. Touch each to let it fall.">
    <div id="heart" aria-hidden="true"></div>
  </div>
</main>

<div id="whisper" aria-live="polite">
  touch what it is <em style="font-style:normal">not</em>
  &nbsp;·&nbsp; <span class="count" id="left">12</span> remain
</div>

<section id="stillness" aria-hidden="true">
  <div class="inner">
    <p id="finalWord">Every name you let fall, and the light did not go out.</p>
    <p class="line2">What stayed when the words were gone has no word.<br>Not this, not this — and still, this.</p>
    <button id="again" type="button">begin again</button>
  </div>
</section>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Jost:wght@400&display=swap">

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- the names we give the unnameable ---- */
  var NAMES = [
    "God","Source","the Self","Love","Truth","the One",
    "Spirit","Nothing","Everything","the Ground","the Witness","the Light"
  ];

  var field  = document.getElementById("field");
  var whisper= document.getElementById("whisper");
  var leftEl = document.getElementById("left");
  var still  = document.getElementById("stillness");
  var again  = document.getElementById("again");
  var nodes  = [];
  var remaining = 0;

  function layout(){
    // place names evenly on a ring, rotated a little so none sits dead-top
    var n = nodes.length || NAMES.length;
    for(var i=0;i<nodes.length;i++){
      var node = nodes[i];
      var frac = node.index / NAMES.length;
      var ang = frac * Math.PI*2 - Math.PI/2 + 0.20;
      var r = 0.405; // ring radius as fraction of field (center is 0.5,0.5)
      var x = 50 + Math.cos(ang)*r*100;
      var y = 50 + Math.sin(ang)*r*100;
      node.el.style.left = x + "%";
      node.el.style.top  = y + "%";
    }
  }

  function build(){
    // clear any previous names
    for(var i=0;i<nodes.length;i++){ if(nodes[i].el.parentNode) nodes[i].el.parentNode.removeChild(nodes[i].el); }
    nodes = [];
    remaining = NAMES.length;
    for(var j=0;j<NAMES.length;j++){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "name";
      b.textContent = NAMES[j];
      b.setAttribute("aria-label", "let fall: " + NAMES[j].replace(/^the\s+/,''));
      (function(btn){ btn.addEventListener("click", function(){ fall(btn); }); })(b);
      field.appendChild(b);
      nodes.push({ el:b, index:j, fallen:false });
    }
    layout();
    updateCount();
    still.classList.remove("shown");
    still.setAttribute("aria-hidden","true");
    whisper.style.opacity = "1";
  }

  function updateCount(){
    leftEl.textContent = remaining;
    whisper.lastChild && (leftEl.nextSibling.textContent = remaining===1 ? " remains" : " remain");
  }

  function fall(btn){
    var rec=null;
    for(var i=0;i<nodes.length;i++){ if(nodes[i].el===btn){ rec=nodes[i]; break; } }
    if(!rec || rec.fallen) return;
    rec.fallen = true;
    remaining--;
    btn.disabled = true;
    // let it drift slightly outward as it dissolves
    var ang = (rec.index/NAMES.length)*Math.PI*2 - Math.PI/2 + 0.20;
    var dx = Math.cos(ang)*26, dy = Math.sin(ang)*26 + 10;
    btn.style.transform = "translate(-50%,-50%) translate("+dx+"px,"+dy+"px)";
    btn.classList.add("falling");
    updateCount();
    if(remaining<=0){ setTimeout(reveal, reduce?300:900); }
  }

  function reveal(){
    whisper.style.opacity = "0";
    still.classList.add("shown");
    still.setAttribute("aria-hidden","false");
    setTimeout(function(){ try{ again.focus(); }catch(e){} }, reduce?400:1600);
  }

  again.addEventListener("click", build);
  window.addEventListener("resize", layout);

  /* ---- the night ---- */
  var sky = document.getElementById("sky");
  var ctx = sky.getContext("2d");
  var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  var stars=[];

  function seedStars(){
    var count = Math.round((W*H)/ (14000));
    count = Math.max(70, Math.min(260, count));
    stars=[];
    for(var i=0;i<count;i++){
      stars.push({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*1.3+0.2,
        base:Math.random()*0.5+0.15,
        amp:Math.random()*0.4+0.1,
        ph:Math.random()*Math.PI*2,
        sp:Math.random()*0.8+0.3
      });
    }
  }
  function resize(){
    W = sky.clientWidth; H = sky.clientHeight;
    sky.width = Math.round(W*DPR); sky.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    seedStars();
    if(reduce) drawStatic();
  }
  function drawStatic(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      ctx.globalAlpha = s.base+s.amp*0.5;
      ctx.fillStyle = "#cdd6ec";
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  var t0=performance.now();
  function frame(now){
    var t=(now-t0)/1000;
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      var a = s.base + s.amp*Math.sin(t*s.sp + s.ph);
      if(a<0) a=0;
      ctx.globalAlpha=a;
      ctx.fillStyle = "#cdd6ec";
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  build();
  if(!reduce) requestAnimationFrame(frame);
})();
</script></body>
</html>
