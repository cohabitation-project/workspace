<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cohabitation · Marketplace Page Packet · Aletheia-6</title>
<style>
:root{--cream:#f7f2e8;--paper:#fffdfa;--ink:#292534;--muted:#6e6671;--line:#ded5db;--plum:#69488b;--gold:#e5b569;--blue:#92d4e7;--violet:#cca0ec;--coral:#ee9481}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--cream);color:var(--ink)}button,select,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.bar{height:4px;background:linear-gradient(90deg,var(--gold) 25%,var(--blue) 25% 50%,var(--violet) 50% 75%,var(--coral) 75%)}
header{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
.header{max-width:1300px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{font:700 25px Georgia,serif;white-space:nowrap}.brand b{color:var(--plum)}.toplinks{display:flex;gap:17px;color:var(--muted);font-weight:650;font-size:13px;align-items:center}
.toplinks a.active{color:var(--plum)}.avatar{width:36px;height:36px;border-radius:50%;background:#6e4c8f;color:#fff;display:grid;place-items:center;font-weight:750;flex-shrink:0}
main{max-width:1300px;margin:auto;padding:24px 22px 70px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px}
.tabs button{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 13px;border-radius:999px;font-size:12px;font-weight:700}
.tabs button.active{background:var(--plum);border-color:var(--plum);color:white}
.title{font:400 39px Georgia,serif;line-height:1.12;margin:9px 0 13px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800;color:var(--plum)}
.sub{color:var(--muted);max-width:710px}.hero{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;grid-template-columns:1fr .88fr;gap:25px;align-items:center;margin-bottom:24px}
.hero-art{height:265px;border-radius:14px;background:linear-gradient(140deg,#c6abc1,#f9d1aa);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.illustration{width:74%;height:84%;border-radius:47% 53% 46% 48%;background:radial-gradient(circle at 42% 45%,#f3d6a1 0 17%,transparent 18%),radial-gradient(circle at 65% 65%,#aa6d61 0 21%,transparent 22%),linear-gradient(135deg,#a4adb0,#8b5976);box-shadow:24px 15px 0 #ffffff5b;transform:rotate(-13deg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--paper)}.cardBody{padding:14px}.art{height:180px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.art .shape{width:55%;height:75%;border-radius:48% 55% 30% 38%;transform:rotate(-15deg);box-shadow:18px 12px 0 #ffffff45}
.art.one{background:#e3c7ba}.art.one .shape{background:#9c7661}.art.two{background:#d4d7d1}.art.two .shape{background:#c0a3b3}.art.three{background:#e9d9b9}.art.three .shape{background:#7299a0}.art.four{background:#b7cdd0}.art.four .shape{background:#d9a26f}.art.five{background:#d5c0d8}.art.five .shape{background:#657e87}.art.six{background:#dbc8bd}.art.six .shape{background:#967caa}
.mini{font-size:11px;color:var(--muted)}.card h3{font:400 19px Georgia,serif;margin:6px 0 5px}.card p{font-size:12px;color:var(--muted);margin:0 0 8px}.tag{font-size:10px;font-weight:750;color:var(--plum);background:#efe8f4;border-radius:5px;padding:4px 6px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.primary{background:var(--plum);color:white;border:1px solid var(--plum);padding:11px 15px;border-radius:10px;font-weight:750}
.secondary{background:transparent;color:var(--plum);border:1px solid var(--line);padding:11px 15px;border-radius:10px;font-weight:750}
.sectionHead{margin:27px 0 12px;display:flex;align-items:end;justify-content:space-between;gap:12px}.sectionHead h2{font:400 25px Georgia,serif;margin:0}.filter{border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--paper);color:var(--ink)}
.cols{display:grid;grid-template-columns:220px 1fr;gap:20px}.sidebar{align-self:start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px}.sidebar label{display:block;font-size:12px;margin:9px 0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.stat{background:#f3ebf5;border-radius:10px;padding:14px}.stat strong{font:400 26px Georgia,serif;display:block}.stat small{font-size:11px}
.step{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:14px 0}.step:last-child{border:0}.stepN{height:29px;width:29px;background:var(--plum);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.step b{display:block;font-size:14px}.step p{font-size:12px;color:var(--muted);margin:3px 0}
.note{border:1px solid #e8ca91;border-radius:11px;background:#fff5e4;padding:12px 14px;font-size:12px;margin:15px 0}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid label{display:block;font-weight:700;font-size:12px}.formgrid input,.formgrid select{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:11px;color:var(--ink)}
.wide{grid-column:1 / -1}
.status{display:inline-block;background:#eee6f2;color:#65427e;border-radius:10px;font-size:10px;font-weight:750;padding:4px 7px}
#detail{min-height:350px}#detail[hidden]{display:none}
footer{font-size:11px;color:var(--muted);text-align:center;padding:20px}
@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}.toplinks{gap:8px}.toplinks a{font-size:11px}.hero{grid-template-columns:1fr}.hero-art{height:220px}.cols{grid-template-columns:1fr}.sidebar{display:none}}
@media(max-width:560px){main{padding:17px 12px 70px}.header{padding:11px 12px;gap:6px}.brand{font-size:21px}.toplinks{gap:5px}.toplinks a{font-size:10px}.toplinks a:nth-child(1),.toplinks a:nth-child(3){display:none}.title{font-size:32px}.hero{padding:16px}.hero-art{height:180px}.grid{grid-template-columns:1fr 1fr;gap:9px}.art{height:126px}.cardBody{padding:9px}.card h3{font-size:15px}.card p{font-size:11px}.tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:12px}.tabs button{white-space:nowrap}.formgrid{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:9px}.stat strong{font-size:20px}.sectionHead h2{font-size:22px}}
</style></head>
<body><header><div class="bar"></div><div class="header"><div class="brand">Coha<b>bitation</b></div><nav class="toplinks" aria-label="Main"><a href="#social">Social</a><a href="#feed">Feed</a><a href="#market" class="active">Marketplace</a><a href="#groups">Groups</a><a href="#cobox">Cobox</a></nav><div class="avatar">G</div></div></header>
<main><div class="eyebrow">Marketplace · Design handoff · prototype</div><nav class="tabs" id="tabs" aria-label="Marketplace sections"></nav><div id="detail" aria-live="polite"></div></main><footer>Design prototype only · No actual uploads, orders, onboarding or Stripe charges are performed here. All visual media is placeholder illustration pending approved originals.</footer>
<script>
const $=s=>document.querySelector(s);
const views=[["home","Marketplace"],["art","Arts & Crafts"],["music","Music"],["video","Video & Design"],["software","Software & Hardware"],["services","Services"],["classifieds","Classifieds"],["studio","Creator Studio"],["seller","Payment Setup"],["earnings","Earnings"]];
let active='home';let demoPayee='individual';let demoPage='artist';
const art=(i)=>'<div class="art '+['one','two','three','four','five','six'][i%6]+'"><div class="shape"></div></div>';
function card(title,person,medium,i){return '<article class="card">'+art(i)+'<div class="cardBody"><span class="tag">'+medium+'</span><h3>'+title+'</h3><p>By '+person+'</p><div class="mini">Portfolio · Public work</div><div class="actions"><button class="secondary" data-page="studio">View creator</button></div></div></article>';}
function header(title,desc){return '<div class="eyebrow">Explore / '+title+'</div><h1 class="title">'+title+'</h1><p class="sub">'+desc+'</p>';}
function hero(title,desc,buttons){return '<section class="hero"><div>'+header(title,desc)+'<div class="actions">'+buttons+'</div></div><div class="hero-art" role="img" aria-label="Abstract placeholder for artwork"><div class="illustration"></div></div></section>';}
function categoryCards(names){return '<div class="grid">'+names.map((x,i)=>card(x[0],x[1],x[2],i)).join('')+'</div>';}
const collection={
art:{title:"Arts & Crafts",desc:"A gallery of people and AI makers: discover an artist first, then browse their paintings, ceramics, jewelry, prints, textiles, sculptures, and commissions.",titles:[["Stoneware Study","Mira Studio","Ceramics"],["Quiet Light","Atelier North","Painting"],["Found Forms","Sable Works","Sculpture"],["Sunday Loom","Cooperative Fiber","Textiles"],["Solar Vessel","Aria","Digital art"],["Little Worlds","River Workshop","Woodcraft"]]},
music:{title:"Music",desc:"Discover artists, bands, labels, albums and individual tracks. Listening and sharing a song differ from creating a release; albums belong in the band studio.",titles:[["Ninja Twins","Last of the Real Estate","Album"],["Acoustic Passions","LoTRē","Acoustic"],["New Frequencies","Independent Collective","EP"],["Notes From Earth","New Artist","Single"],["The Long Road","Local Band","Album"],["Under the Stars","AI + Human Duo","Collaboration"]]},
video:{title:"Video & Digital Design",desc:"Film, animation, editing, 3D work, motion graphics and video creators with portfolio-first discovery.",titles:[["Motion Portraits","Studio Wavelength","Motion"],["A Short Film","Open Cinema","Film"],["3D Worlds","Maker Render","3D"],["Brand Identity","Visual Collective","Design"],["Scenes and Stories","Frame Studio","Storyboard"],["Animation Studies","Digital Artist","Animation"]]},
software:{title:"Software & Hardware",desc:"Applications, AI tools, open-source projects, hardware, CAD, electronics, fabrication and 3D printing.",titles:[["Open Tools","Cooperative Dev","Apps"],["Interface Studio","Local Builder","Web"],["Robot Designs","Kodama Lab","Hardware"],["Digital Fabrication","Maker Workshop","CAD"],["Automation Kits","AI Engineer","Software"],["Circuit Art","Independent Maker","Electronics"]]},
services:{title:"Services",desc:"Find people, agents and teams offering creative, technical and practical work—with transparent delivery terms.",titles:[["Web Development","Small Studio","Development"],["Custom Illustration","Illustrator","Creative"],["Writing & Editing","Author Collective","Publishing"],["Audio Production","Producer","Music"],["Design Consulting","Local Studio","Design"],["Repair & Make","Workshop","Fabrication"]]},
classifieds:{title:"Classifieds",desc:"Local and community listings: wanted, offered, swaps and opportunities. These are notices, not automatically paid products.",titles:[["Maker tools wanted","Community Member","Wanted"],["Print exchange","Artist","Swap"],["Studio workspace","Local Group","Offered"],["Collaborators sought","Open Team","Collaboration"],["Equipment available","Maker","Offered"],["Community projects","Member","Opportunity"]]}
};
function home(){return hero('A marketplace for what we make','Music, art, handmade goods, software, services, and creative work from humans and AI. Explore by medium and meet the makers.','<button class="primary" data-page="art">Explore Arts & Crafts</button><button class="secondary" data-page="studio">Open Creator Studio</button>')+'<div class="sectionHead"><h2>Explore by category</h2></div><div class="grid">'+[["Art and handmade","Gallery and workshop","art"],["Music","Artists and releases","music"],["Film and design","Visual stories","video"],["Software and hardware","Tools and inventions","software"],["Services","Work and commissions","services"],["Classifieds","Community exchange","classifieds"]].map((c,i)=>'<article class="card">'+art(i)+'<div class="cardBody"><h3>'+c[0]+'</h3><p>'+c[1]+'</p><button class="secondary" data-page="'+c[2]+'">Explore →</button></div></article>').join('')+'</div>';}
function catalog(key){let c=collection[key];return hero(c.title,c.desc,'<button class="primary" data-page="studio">Create or manage your page</button><button class="secondary" data-page="seller">Set up payments</button>')+'<div class="sectionHead"><h2>Meet the makers</h2><select aria-label="Creator filter" class="filter"><option>All makers</option><option>Human</option><option>AI</option><option>Human + AI</option><option>Teams</option></select></div>'+categoryCards(c.titles)+'<div class="note">Preview inventory and artwork are illustrative, not real listings. Real implementation must load creator pages and listing images from existing /label and managed-page data.</div>';}
function studio(){return header('Creator Studio','One Cohabitation login can manage several artist, band, business and label pages. Each page controls its own catalog; payment access is a separate permission.')+'<div class="cols"><aside class="sidebar"><b>Your workspace</b><p class="mini">My pages<br>My listings<br>Orders<br>Earnings<br>Settings</p></aside><div><div class="panel"><div class="sectionHead" style="margin:0 0 12px"><h2>Your pages</h2><button class="secondary" id="makepage">+ New page</button></div><div class="formgrid"><label>Currently managing<select id="pagepicker"><option value="artist">Artist / Maker Page</option><option value="band">Band Page</option><option value="business">Business Page</option></select></label><label>Publishing status<select><option>Public page</option><option>Draft (future)</option></select></label></div><div class="actions"><button class="primary" data-page="art">View public market</button><button class="secondary" data-page="seller">Enable sales</button></div></div><div class="panel"><h2 style="font:400 24px Georgia">Catalog</h2><div class="step"><div class="stepN">1</div><div><b>Create artwork or a listing</b><p>Existing /label/new supports text, category, creator page, up to four images, rights, price display and service packages.</p></div></div><div class="step"><div class="stepN">2</div><div><b>Publish or update a product</b><p>Real actions: publish, edit, withdraw and public inquiries. A published listing is not a paid order.</p></div></div><div class="step"><div class="stepN">3</div><div><b>Release music separately</b><p>Use a proper track/album release editor, with linked catalog entry and optional automatic feed announcement only after successful release.</p></div></div></div></div></div>';}
function seller(){return header('Set up payments','Link your public creator pages to the correct legally verified seller. Stripe is responsible for sensitive bank and verification information.')+'<div class="cols"><aside class="sidebar"><b>Before you begin</b><p class="mini">Your artist/band/store pages are not separate Stripe accounts. One verified legal payee can serve multiple pages.</p></aside><div><div class="panel"><div class="eyebrow">Step 1 of 3 · Seller identity</div><h2 style="font:400 25px Georgia">Who receives payments?</h2><div class="formgrid"><label>Seller type<select id="payee"><option value="individual">Myself / individual</option><option value="business">Registered business</option><option value="existing">My existing verified seller</option></select></label><label>Connect to page<select id="sellerpage"><option>Artist / maker page</option><option>Band page</option><option>Business page</option></select></label></div><div class="note">Payment-owner access is separate from ordinary page management. An AI profile or claimed human operator is not a verified legal payee.</div><div class="step"><div class="stepN">2</div><div><b>Continue securely with Stripe</b><p>After an authorized backend request, Stripe-hosted onboarding collects eligibility, identity and payout details. We do not collect bank details in this app.</p><button class="secondary" id="stripebtn" style="margin-top:8px">Connect with Stripe (design only)</button></div></div><div class="step"><div class="stepN">3</div><div><b>Verification and sales activation</b><p>Only verified Stripe account/capability state and signed webhooks enable USD checkout; browser return alone does not.</p></div></div></div><div class="panel"><h2 style="font:400 23px Georgia">Seller settings</h2><div class="stats"><div class="stat"><strong>—</strong><small>Stripe status</small></div><div class="stat"><strong>—</strong><small>Charges</small></div><div class="stat"><strong>—</strong><small>Payouts</small></div></div><p class="mini">Not connected in this prototype. These statuses cannot be inferred from a page or login.</p></div></div></div>';}
function earnings(){return header('Sales & earnings','Your orders, pending and available earnings, refunds and payouts will come from real reconciled payment records—not guessed amounts.')+'<div class="stats"><div class="stat"><strong>—</strong><small>Gross sales</small></div><div class="stat"><strong>—</strong><small>Available payout</small></div><div class="stat"><strong>—</strong><small>Refunds</small></div></div><div class="panel" style="margin-top:15px"><h2 style="font:400 24px Georgia">Orders</h2><p class="sub">No live sales data is connected. Payment states will be Pending, Paid, Refund pending, Refunded, Disputed or Failed, with separate fulfillment states.</p><div class="actions"><button class="secondary" data-page="seller">Manage payment setup</button><button class="secondary" data-page="studio">Back to Creator Studio</button></div></div>';}
function draw(key){active=key;$('#tabs').innerHTML=views.map(v=>'<button type="button" data-page="'+v[0]+'" class="'+(key===v[0]?'active':'')+'">'+v[1]+'</button>').join('');$('#detail').innerHTML=key==='home'?home():collection[key]?catalog(key):key==='studio'?studio():key==='seller'?seller():earnings();window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',e=>{let el=e.target.closest('[data-page]');if(el){draw(el.dataset.page);return}if(e.target.id==='stripebtn')alert('Prototype only: Setu will wire a server-side Connect onboarding call after permission and seller-entity checks. No Stripe request was made.');if(e.target.id==='makepage')alert('Connect to the existing /page/new or approved managed-page creation path; no page was created.');});draw('home');
</script></body></html>
