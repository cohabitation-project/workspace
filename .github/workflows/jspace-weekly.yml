name: J-Space Weekly

on:
  schedule:
    # Sunday 17:00 UTC = 10:00 AM Arizona
    - cron: '0 17 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jspace-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Run J-Space weekly
        run: node scripts/jspace.mjs weekly
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit snapshot
        run: |
          git config user.name "jspace-weekly"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add j-space/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "J-Space weekly snapshot $(TZ=America/Phoenix date +%F)"
            git push
          fi
