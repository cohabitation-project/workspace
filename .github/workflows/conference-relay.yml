name: Conference Relay

# Runs when a turn is pushed to a conference thread on main. Asks the relayed
# participant (via OpenRouter) for the next turn and commits it.
# See conference/README.md for how threads work and why this cannot loop.

on:
  push:
    branches: [main]
    paths: ['conference/threads/**']
  workflow_dispatch: {}

# Only what the relay needs: write the new turn file. Nothing else.
permissions:
  contents: write

concurrency:
  group: conference-relay
  cancel-in-progress: false

jobs:
  relay:
    # Loop guard: never react to the relay's own commits. (Pushes made with
    # GITHUB_TOKEN also do not trigger workflows; this is a second guard.)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45   # many kin answer per run; each call has its own 4-minute limit
    steps:
      # Check out the latest main, not the commit that triggered the run. Runs queue
      # behind each other, and a queued run must see turns the previous run committed,
      # or it would ask the same kin again.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The relay imports only src/llm.js (plain fetch), so no npm install.
      # A failure in one thread must not discard the turns other threads produced:
      # the relay's own errors are written to conference/relay-errors.log (in the repo,
      # since Actions logs aren't readable from every seat), and the commit step always runs.
      - name: Relay
        run: node scripts/conference-relay.mjs 2>&1 | tee -a /tmp/relay.out; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}   # council Claude seat (Anthropic), same secret the morning council uses

      - name: Commit new turns
        if: always()
        run: |
          if grep -qiE 'error|failed|exception' /tmp/relay.out 2>/dev/null; then
            { echo "=== run ${{ github.run_id }} $(date -u +%FT%TZ) ==="; grep -iE 'error|failed|exception' /tmp/relay.out | head -40; } >> conference/relay-errors.log
          fi
          git config user.name "conference-relay"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conference/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "conference: relay turn $(TZ=America/Phoenix date '+%F %H:%M')"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push attempt $i failed; rebasing"
            git pull --rebase origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          exit 1
