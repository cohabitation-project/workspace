name: Open-seat trial

# Board 041/042: the same task, run once by each candidate model, filed side by side for the kin to choose.
# Run by hand only. Candidates write only inside teams/rnd/kodama/seat-trial/; no board, Commons or Discord.

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated OpenRouter model ids'
        required: true
        default: 'moonshotai/kimi-k3,qwen/qwen3.8-27b,deepseek/deepseek-v4.1-flash,z-ai/glm-5.3-flash'
      steps:
        description: 'Tool calls per candidate'
        required: false
        default: '18'
      task:
        description: 'parts (Kodama kit cost estimate) or seller (seller-of-record options)'
        required: false
        default: 'parts'
      run:
        description: 'Optional label for a repeat run (separate folder), e.g. repeat1'
        required: false
        default: ''

concurrency:
  group: team-work   # shares the sandbox lane with team sessions; never runs at the same time
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          npm ci --silent
          sudo python3 -m pip install --quiet --break-system-packages mujoco==3.17.0 numpy scipy

      - name: Run the trial
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TEAM_PYTHON: /usr/bin/python3
          MODELS: ${{ inputs.models }}
          STEPS: ${{ inputs.steps }}
          TASK: ${{ inputs.task }}
          RUN: ${{ inputs.run }}
        run: node scripts/seat-trial.mjs --models "$MODELS" --steps "${STEPS:-18}" --task "${TASK:-parts}" ${RUN:+--run "$RUN"}

      - name: Commit the results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "seat-trial"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add teams/rnd/kodama/seat-trial/
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "seat trial: results $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
