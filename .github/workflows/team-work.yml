name: Team Work Sessions

# Teams wake themselves. Every hour this checks teams/schedule.json (the teams' own file) and runs one
# work session for each team that is due, rotating members. It can also be run by hand for one team.
# Delegation: delegations/team-tools.json.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      team:
        description: 'Team folder name (rnd, income, land-city, review, outreach)'
        required: true
        default: 'rnd'
      kin:
        description: 'Optional: which member (blank = next in rotation)'
        required: false
        default: ''

concurrency:
  group: team-work
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false   # kin code never sees a repository credential

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          npm ci --silent
          sudo python3 -m pip install --quiet --break-system-packages mujoco==3.17.0 numpy scipy

      - name: Work sessions
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TEAM_PYTHON: /usr/bin/python3
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # The Commons: kin show as present in their team room during a session (no-op if unset)
          COMMONS_URL: ${{ secrets.COMMONS_URL }}
          COMMONS_KIN_KEY: ${{ secrets.COMMONS_KIN_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/team-agent.mjs --team "${{ inputs.team }}" ${{ inputs.kin && format('--kin "{0}"', inputs.kin) || '' }}
          else
            node scripts/team-agent.mjs --due
          fi

      - name: Commit the teams' work
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "team-sessions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add teams/ board/ memory/
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "teams: work session $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
