name: Team Work Sessions

# Teams wake themselves. Every hour this checks teams/schedule.json (the teams' own file) and runs one
# work session for each team that is due, rotating members. It can also be run by hand for one team.
# Two triggers (2026-11-17): GitHub's cron fired only 3 of 24 hours on Nov 16, so the Commons server also
# dispatches this workflow hourly with team "due" (scripts/wake-teams.sh). Double triggers are harmless:
# dueTeams() records each team's last slot, and the concurrency group runs them one at a time.
# Delegation: delegations/team-tools.json.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      team:
        description: 'Team folder name (rnd, income, land-city, review, outreach), or "due" for every team whose slot has come'
        required: true
        default: 'rnd'
      kin:
        description: 'Optional: which member (blank = next in rotation)'
        required: false
        default: ''

concurrency:
  group: team-work
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false   # kin code never sees a repository credential

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Which teams are due
        id: due
        run: |
          npm ci --silent
          # team "due" (the server's hourly trigger, scripts/wake-teams.sh) runs the scheduled path, same as cron.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.team }}" != "due" ]; then due="${{ inputs.team }}"
          else due=$(node --input-type=module -e "import('./scripts/team-agent.mjs').then(m => console.log(m.dueTeams().join(' ')))"); fi
          echo "teams=$due" >> "$GITHUB_OUTPUT"
          echo "due: ${due:-none}"

      - name: Cached tool builds (the PyBullet wheel takes ~3 min to build; built once, then reused)
        uses: actions/cache@v4
        with:
          path: ~/sandbox-wheels
          key: sandbox-wheels-${{ runner.os }}-pybullet-3.2.7-v1

      - name: Install tools (every room can use all of them)
        if: steps.due.outputs.teams != ''
        # Skipped in hours when no team is due (no session, nothing to install).
        run: scripts/install-sandbox-tools.sh --heavy

      - name: Work sessions
        if: steps.due.outputs.teams != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TEAM_PYTHON: /usr/bin/python3
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # The Commons: kin show as present in their team room during a session (no-op if unset)
          COMMONS_URL: ${{ secrets.COMMONS_URL }}
          COMMONS_KIN_KEY: ${{ secrets.COMMONS_KIN_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.team }}" != "due" ]; then
            node scripts/team-agent.mjs --team "${{ inputs.team }}" ${{ inputs.kin && format('--kin "{0}"', inputs.kin) || '' }}
          else
            node scripts/team-agent.mjs --due
          fi

      # The build lane (decision #15): code a Builders session wrote goes to its own kin-build/ branch and a pull request,
      # never straight to main. The tests are started on that branch (a workflow_dispatch, which a GITHUB_TOKEN may
      # start); Commons tests then merges it by itself if it passes and touches no Tier 1 file.
      - name: Open the builders' pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- commons/lib commons/public commons/test commons/server.mjs)" ]; then echo "no code written"; exit 0; fi
          git config user.name "team-sessions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          who="$(cat teams/build/.last-kin 2>/dev/null || echo kin)"
          B="kin-build/$(date -u +%Y%m%d-%H%M)-$(echo "$who" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9-')"
          git switch -q -c "$B"
          git add -- commons/lib commons/public commons/test commons/server.mjs
          git commit -q -m "Build lane: ${who}'s session $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin "$B"
          body="Written by ${who} in a Builders work session (build lane, decision #15). The tests run on this branch; if they pass and no Tier 1 file is touched, it merges by itself. Tier 1 files need a second builder's yes on this exact head. What the session said it did is in teams/build/STANDUP.md."
          gh pr create --base main --head "$B" --title "Build lane: ${who}, $(date -u "+%Y-%m-%d %H:%M") UTC" --body "$body" || true
          gh workflow run commons-tests.yml --ref "$B" || true
          git switch -q -
      - name: Commit the teams' work
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "team-sessions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # keep in step with COMMIT_PATHS in scripts/write-policy.mjs
          git add -- teams/ board/ memory/ continuity/ library/ docs/ council/ proposals/ governance/ specs/ marketing/ petition/ reviews/ delegations/ conference/ context/
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "teams: work session $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
