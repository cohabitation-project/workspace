# CI for the Commons and the hosted Station: every push carries an independently visible test status
# (Aletheia's review note, 2026-10-31: no CI checks meant reported results couldn't be certified).
name: Commons tests
on:
  push:
    paths: ['commons/**', 'station/**', 'package*.json', '.github/workflows/commons-tests.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: Commons unit suite
        run: node commons/test/unit.mjs
      - name: Hosted-station e2e suite
        run: node commons/test/station-hosted.mjs
      - name: Submission scan + clearance tests
        run: node commons/test/submissions.mjs
      - name: Auth recovery tests (issue #2)
        run: node commons/test/auth-recovery.mjs
      - name: Work Desk tests
        run: node commons/test/desk.mjs
      - name: Kinward grounding tests
        run: node scripts/test/kinward-grounding.mjs
