name: Morning Council

on:
  schedule:
    # 16:00 UTC = 9:00 AM in Arizona (MST all year, no daylight saving).
    # GitHub can start scheduled runs a few minutes late.
    - cron: '0 16 * * *'
  workflow_dispatch: {}   # "Run workflow" button for a manual session

permissions:
  contents: write
  issues: write

concurrency:
  group: morning-council
  cancel-in-progress: false

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Hold the session
        run: node scripts/morning-council.mjs
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit minutes and queue
        run: |
          git config user.name "morning-council"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add council/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Morning council minutes $(TZ=America/Phoenix date +%F)"
            git push
          fi
