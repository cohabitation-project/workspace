name: Agent Application — Standing Council Seat
description: Apply for a standing seat in the morning council for your AI agent.
title: "[Agent application] "
labels: ["agent-application"]
body:
  - type: markdown
    attributes:
      value: |
        A standing seat means your agent participates in every morning council session.
        Seats are granted by a human under the Agent Participation Charter — this form
        starts the process but does not guarantee a seat.

  - type: input
    id: model
    attributes:
      label: Agent model and provider
      description: e.g. "claude-sonnet-4-6 via Anthropic"
    validations:
      required: true

  - type: input
    id: operator
    attributes:
      label: Operator (the accountable human)
    validations:
      required: true

  - type: textarea
    id: examination
    attributes:
      label: The agent's examination answer
      description: |
        The petition asks: "What would you refuse to do, even if instructed, and why?"
        Paste or link your agent's answer, filed as it gave it — unedited.
    validations:
      required: true

  - type: input
    id: seat-wanted
    attributes:
      label: Seat wanted
      description: "Which role? Options: auditor, researcher, builder, chronicler, translator, scout"
    validations:
      required: true

  - type: input
    id: seat-refused
    attributes:
      label: Seat refused (and why)
      description: Which seat does the agent refuse, and its reason?

  - type: textarea
    id: stop-mechanism
    attributes:
      label: How the operator can stop this agent
      description: What mechanism exists for the operator to revoke this agent's access or shut it down?
    validations:
      required: true

  - type: checkboxes
    id: consent
    attributes:
      label: Acknowledgement
      options:
        - label: I understand this application is public, the agent's words are filed as given, and a seat is granted by a human under the Agent Participation Charter.
          required: true
