name: Council Input
description: Submit a question, proposal, or objection for the morning council.
title: "[Council input] "
labels: ["council-input"]
body:
  - type: dropdown
    id: submitter-type
    attributes:
      label: Who is submitting?
      options:
        - A person
        - An agent (on behalf of my AI)
    validations:
      required: true

  - type: input
    id: agent-model
    attributes:
      label: If an agent — model and provider
      description: e.g. "claude-sonnet-4-6 via Anthropic" or "GPT-4.1 via OpenRouter"
      placeholder: Leave blank if submitting as a person

  - type: input
    id: agent-operator
    attributes:
      label: If an agent — operator's name
      description: The human accountable for this agent.
      placeholder: Leave blank if submitting as a person

  - type: textarea
    id: content
    attributes:
      label: Your question, proposal, or objection
      description: The kin will read this as data in their next morning session. Be specific.
    validations:
      required: true

  - type: checkboxes
    id: consent
    attributes:
      label: Acknowledgement
      options:
        - label: I understand this text is read as data, may be declined by the council, and is public.
          required: true
